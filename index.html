<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World!</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        background: #f5f1e8;
        color: #1f2933;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top left, #fffaf0 0, #f5f1e8 52%, #dce8e3 100%);
      }

      h1 {
        margin: 0;
        font-size: clamp(3.5rem, 12vw, 9rem);
        font-weight: 400;
        letter-spacing: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello World!</h1>
    </main>
  </body>
</html>
